<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go-Tiny-URL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body class="align-items-center justify-content-center text-center">
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <h2 class="pl-5 fw-bold">Go-Tiny-URL</h2>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Welcome</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container d-flex flex-column align-items-center justify-content-center">
        <h1 class="display-3 fw-bold text-dark">Big URLs? Nah, we go tiny!</h1>
        <div id="welcome-text-content">
            <p class="fs-4 mt-3">Your go-to URL shortener for quick and easy link management.</p>
            <p class="fs-5 mt-3">Fast, reliable, and free. Get started by clicking the link below.</p>
            <button id="enter-url-page" class="btn btn-custom btn-lg mt-6 px-4 py-2" onclick="EnterShortnerPage()">Let's
                Go Short</button>
        </div>

        <div id="tinified-url-space" class="mt-5 col-6">
            <div class="card text-center border border-dark">
                <div class="card-body d-flex" id="url-loading-card">
                    <p id="text-to-copy" class="col-10">some url</p>
                    <button class="btn btn-primary col-2" id="copy-button" onclick="copyRetrievedUrl()">Copy</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast">
        <div class="toast-header">
          Toast Header
        </div>
        <div class="toast-body">
          Some text inside the toast body
        </div>
      </div>
</body>

<script src="/assets/scripts/index.js"></script>

<script>
    $(document).ready(function(){
      $('.toast').toast('show');
    });
    </script>
</html>
